{% if field.field.widget.input_type == "checkbox" %}
<div class="field check {{ class }}{% if field.errors %} has-error{% endif %}">
  {{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.errors %}<div class="errors">{{ field.errors|join:" " }}</div>{% endif %}
</div>
{% else %}
<div class="field {{ class }}{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="errors">{{ field.errors|join:" " }}</div>{% endif %}
</div>
{% endif %}
