{% load static %}<a class="ncard" href="{{ p.get_absolute_url }}" data-reveal style="--d:{{ forloop.counter0 }}0ms">
  <div class="img">{% if p.image %}<img src="{{ p.image.url }}" alt="" loading="lazy">{% else %}<div class="ph"><img src="{% static 'img/tanpa-logo-256.png' %}" alt=""></div>{% endif %}
    <div class="date"><b>{{ p.published_at|date:"j" }}</b><span>{{ p.published_at|date:"M Y" }}</span></div></div>
  <div class="body"><h3>{{ p.title }}</h3><p>{{ p.summary|default:p.body|truncatewords:22 }}</p><span class="more">Read more {% include "partials/icon.html" with name="arrow" size=16 %}</span></div>
</a>
