{% extends "base.html" %}{% load static %}
{% block content %}
<section class="section" style="background:var(--bg-soft);padding:64px 0">
  <div class="wrap">
    <div class="card" style="max-width:460px;margin:0 auto;padding:32px">
      <div class="center" style="margin-bottom:18px"><img src="{% static 'img/tanpa-logo-256.png' %}" alt="" width="72" height="72" style="margin:0 auto 10px"><h1 style="font-size:1.5rem;margin:0">{% block heading %}{% endblock %}</h1>{% block sub %}{% endblock %}</div>
      {% block form %}{% endblock %}
    </div>
  </div>
</section>
{% endblock %}
