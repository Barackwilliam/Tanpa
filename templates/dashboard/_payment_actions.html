<form class="inline-form" method="post" action="{% url 'dashboard:payment_action' p.reference %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="action" value="confirm"><button class="btn btn-primary btn-sm" onclick="return confirm('Confirm {{ p.reference }} as PAID (TZS {{ p.amount }})?')">Confirm</button></form>
<form class="inline-form" method="post" action="{% url 'dashboard:payment_action' p.reference %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="action" value="reject"><input type="hidden" name="reason" value=""><button class="btn btn-danger btn-sm" onclick="var r=prompt('Reason for rejecting?');if(r===null)return false;this.form.reason.value=r;return true;">Reject</button></form>
