<span style="display:inline-flex;gap:6px;white-space:nowrap">
<form class="tp-inline" method="post" action="{% url 'dashboard:payment_action' p.reference %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="action" value="confirm"><button class="tp-btn g sm" onclick="return confirm('Confirm {{ p.reference }} as PAID (TZS {{ p.amount }})?')"><span class="ms">check</span>Confirm</button></form>
<form class="tp-inline" method="post" action="{% url 'dashboard:payment_action' p.reference %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="action" value="reject"><input type="hidden" name="reason" value=""><button class="tp-btn r sm" title="Reject" onclick="var r=prompt('Reason for rejecting?');if(r===null)return false;this.form.reason.value=r;return true;"><span class="ms">close</span></button></form>
</span>
